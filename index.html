<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./css/style.css">
	<title>To-do list</title>
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
	<!-- All things are inside this div -->
	<div class="flex p-3">
		<!-- List container that content lists  -->
		<section class="list-container h-screen w-1/3 p-2 sm:w-1/4 ">
			<!-- Text "list" and add button -->
			<div class="list_title flex justify-between pb-2">
				<h3 class="text-4xl">List</h3>
				<button class="Add_listBtn ml-3 text-xs" id="add_list">
					<div>+</div>
					<p class="font-light">Add</p>
				</button>
			</div>
			<!-- The hide div -->
			<div class="list_name_taker hidden w-fit h-28 absolute top-16 left-8 bg-[#257ce6]">
				<!-- input -->
				<div class="flex justify-between mb-5">
					<input class="bg-cyan-900" type="text" id="list_name">
					<p class="text-[#003356] font-bold">: insert list name</p>
				</div>
				<!-- btns -->
				<div class="flex justify-center ">
					<div  class="flex justify-between w-1/2">
						<button type="button" id="cancel_btn">Cancel</button>
						<button type="button" id="add_list_btn">Add</button>
					</div>
				</div>
			</div>
			<!-- All list are here -->
			<div class="listItems mt-5 w-full">
				<h3 class="lists sm:text-3xl sm:font-light">All</h3>
				<h3 class="lists sm:text-3xl sm:font-light">Daily</h3>
				<h3 class="lists sm:text-3xl sm:font-light">Weekly</h3>
				<h3 class="lists sm:text-3xl sm:font-light">Monthly</h3>
				<h3 class="lists sm:text-3xl sm:font-light">Yearly</h3>
			</div>
		</section>
		<!-- task container -->
		<section class="task-container w-3/4 sm:w-3/4">
			<div class="flex justify-between font-bold px-5">
				<h1 class="text-3xl  border-b">All</h1>
				<button class="Add_listBtn ml-3 text-xs">
					<div>+</div>
					<p class="font-light">Add</p>
				</button>
			</div>
			<div class="tasks">
				<div class="each-task">
					<input type="checkbox" name="" id="">
					<p>Task 1</p>
				</div>
				<div class="each-task">
					<input type="checkbox" name="" id="">
					<p>Task 2</p>
				</div>
				<div class="each-task">
					<input type="checkbox" name="" id="">
					<p>Task 3</p>
				</div>
				<div class="each-task">
					<input type="checkbox" name="" id="">
					<p>Task 4</p>
				</div>
				<div class="each-task">
					<input type="checkbox" name="" id="">
					<p>Task 5</p>
				</div>
				<div class="each-task">
					<input type="checkbox" name="" id="">
					<p>Task 6</p>
				</div>
			</div>
		</section>
	</div>
	<script src="https://code.jquery.com/jquery-4.0.0.min.js"
		integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>">
	<script src="./js/script.js"></script>
</body>

</html>
