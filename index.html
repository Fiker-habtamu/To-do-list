<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./css/style.css">
	<title>To-do list</title>
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	
</head>
<body>
	<!-- All things are inside this div -->
	<div class="container flex p-3">
		<!-- List container that content lists  -->
		<section class="list-container h-screen w-1/3 p-2">
			<!-- Text "list" and add button -->
			<div class="list_title flex justify-between pb-2">
				<h3 class="text-4xl">List</h3>
				<button class="Add_listBtn ml-3 text-xs">
					<div>+</div>
					<p class="font-light">Add</p>
				</button>
			</div>
			<!-- All list are here -->
			<div class="listItems mt-5 w-full">
				<h3 class="lists">All</h3>
				<h3 class="lists">Daily</h3>
				<h3 class="lists">Weekly</h3>
				<h3 class="lists">Monthly</h3>
				<h3 class="lists">Yearly</h3>
			</div>
		</section>
		<!-- task container -->
		<section class="task-container w-3/4">
			<h1>All</h1>
			<div class="tasks">
				<div class="each-task">
					<input type="checkbox" name="" id="">
					 <p>Task 1</p>
				</div>
				<div class="each-task">
					<input type="checkbox" name="" id="">
					 <p>Task 2</p>
				</div>
				<div class="each-task">
					<input type="checkbox" name="" id="">
					 <p>Task 3</p>
				</div>
				<div class="each-task">
					<input type="checkbox" name="" id="">
					 <p>Task 4</p>
				</div>
				<div class="each-task">
					<input type="checkbox" name="" id="">
					 <p>Task 5</p>
				</div>
				<div class="each-task">
					<input type="checkbox" name="" id="">
					 <p>Task 6</p>
				</div>
			</div>
		</section>
	</div>
</body>
</html>
